name: Backend Image

# Builds the backend Docker image (including the Expo web export and the iroh
# bridge binary) and publishes it to GHCR, so a branch can be tested via
# docker compose without waiting for an upstream release:
#
#   image: ghcr.io/ayooooo123/mediastorm:<branch-name-slug>
#
# The Dockerfile expects the frontend repo checked out at ./frontend, so this
# workflow needs a secret named FRONTEND_CHECKOUT_TOKEN: a fine-grained PAT
# with Contents: Read access to ayooooo123/mediastorm-frontend.
on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The web-builder stage bundles the Expo web app; check out the frontend
      # repo at the same branch (both repos share branch names for features).
      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          repository: ayooooo123/mediastorm-frontend
          ref: ${{ github.ref_name }}
          token: ${{ secrets.FRONTEND_CHECKOUT_TOKEN }}
          path: frontend

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          # Single-arch keeps CI fast; add linux/arm64 here if the server is ARM.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
