name: Backend Image

# Builds the backend Docker image (including the Expo web export and the iroh
# bridge binary) and publishes it to GHCR, so a branch can be tested via
# docker compose without waiting for an upstream release:
#
#   image: ghcr.io/ayooooo123/mediastorm:<branch-name-slug>
#
# The image is built without the /watch web UI (WEB_APP_STAGE=web-stub) so the
# build needs nothing beyond this repo — the Android/TV apps never use /watch.
on:
  push:
    branches:
      - master
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          # Single-arch keeps CI fast; add linux/arm64 here if the server is ARM.
          platforms: linux/amd64
          build-args: |
            WEB_APP_STAGE=web-stub
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
